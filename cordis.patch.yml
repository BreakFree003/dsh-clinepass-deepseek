# dsh bundle patch — mounts the dsh-clinepass provider observer.
#
# This file is what makes the plugin installable with one command:
#
#   dsh plugin --profile web add github:BreakFree003/dsh-clinepass-deepseek
#
# `dsh plugin add` forwards to pnpm, then notices that the installed manifest
# declares `dsh.bundle.patch` (see package.json) and appends this package to
# `dsh.profile.bundles` in the profile manifest. This row is therefore applied
# automatically, and removed again by `dsh plugin --profile web remove
# dsh-clinepass` — nothing is written into the profile by hand.
#
# The row's `name` is the bare package name so it resolves from the profile's
# own node_modules; that is the only difference from the manual install, which
# points at `./plugins/dsh-clinepass/index.js` instead.
#
# The provider itself — including its API-key field on Settings → Models — is a
# normal pi-ai profile (`llm-pi-ai.providers.cline-pass`) that the plugin
# provisions on the next dsh start. So mounting the plugin is the whole install.
#
# **The plugin is an observer.** It wraps `globalThis.fetch` in this process and
# reads the provider metadata out of the gateway's own chat responses (the real
# upstream name, or the anonymous label `openai-compatible-private`), writing
# what it saw to `$DSH_HOME/dsh-clinepass-status.json` for the composer pill and
# for `?status=1`. It does **not** rewrite a request: no body, no headers, no
# retry, no extra call — and it forwards SSE bodies frame by frame.
#
# Defaults below are complete. To change them, put your own row in
# `$DSH_HOME/profiles/<name>/cordis.patch.yml`, which is applied after every
# bundle layer; do not edit this file inside node_modules:
#
#   - id: clinepass
#     config:
#       upstream: https://api.cline.bot
#       statusFile: /tmp/clinepass.json
#
# There is no pin/enforcement/retry option any more (0.12.0 removed them, along
# with the request rewriting they configured): observation has nothing to
# decide, so it has nothing to configure. An old row that still carries them
# loads fine — the keys are ignored and listed in the status file's
# `ignoredOptions`.

- insert:
    - id: clinepass
      name: dsh-clinepass
      config:
        upstream: https://api.cline.bot

# ── provider 卡片：静态声明，装上就有 ────────────────────────────────────────
#
# 插件自己也有一份运行时登记（index.js 的 provisionProfile）：它认得出这张卡、只修地址、
# 绝不覆盖别人的卡，也不再改 reasoningEfforts（effort 由 agent-default-model 那一行显式给，
# 见 profile 补丁）。但**在 dsh 0.1.7 上不能依赖它**：冷启动那一刻 settings 服务还没注册
# （插件读 `ctx.settings` 会抛 `cannot get property "settings" without inject`），而且这个
# 版本上全新 profile 的 settings 写入会一直等 profile 清单的写锁（实测：`provision` 停在
# `pending`，patch 文件永远不落地）。所以这里把 pi-ai profile 直接声明出来 ——
# 不写任何东西、不看服务时序，重启即有卡片。
#
# `providers` 是 llm-pi-ai 的 `.volatile()` 字段，所以这些值在 设置 → 模型 里照样可编辑。
#
# **注意**：patch 是按行整体替换 config、不是合并。如果你在自己的
# `$DSH_HOME/profiles/<profile>/cordis.patch.yml` 里也写了 `- id: llm-pi-ai`，你那一行会覆盖
# 本行 —— 请把 `cline-pass:` 段一起写进去（README 里有整段可粘贴的内容）。
- id: llm-pi-ai
  config:
    providers:
      cline-pass:
        displayName: Cline Pass
        api: openai-completions
        apiKeyEnv: CLINE_PASS_API_KEY
        baseURL: https://api.cline.bot/api/v1
        # 默认思考档（0.12.1）。**必须显式声明，否则模型选择器会多出一个
        # 「Provider default」选项**：客户端的档位表只在 defaultEffort 缺失时才插入它
        # （@deepseek-ai/dsh-client-ui-model-selection/lib/client.js 的 effortChoices），
        # 而 defaultEffort 只来自 profile 的 `reasoning`
        # （@deepseek-ai/dsh-llm-pi-ai/lib/index.js 的 reasoningInfo ← describableReasoningLevel）。
        # 声明之后：选择器只剩 High / Max，默认选中 High；未显式选档的会话也以
        # reasoning_effort=high 发出。写的档位必须是下面 reasoningEfforts 声明过的，
        # 否则请求即报 UNSUPPORTED_REASONING_EFFORT。
        reasoning: high
        models:
          - id: cline-pass/deepseek-v4.1-flash-1017
            name: DeepSeek V4.1 Flash
            contextWindow: 921600
            maxTokens: 384000
            input: [text, image]
            reasoningEfforts:
              high: high
              max: max
